apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-python-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-python-app
  template:
    metadata:
      labels:
        app: my-python-app
    spec:
      containers:
        - name: my-python-app
          image: ghcr.io/prsh17/my-python-app:v1.0.0
          ports:
            - containerPort: 8000
          imagePullPolicy: Always
          env:
            - name: PORT
              value: "8000"

---
apiVersion: v1
kind: Service
metadata:
  name: my-python-app
spec:
  type: NodePort
  selector:
    app: my-python-app
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30080

